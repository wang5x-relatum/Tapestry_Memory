[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tapestry-memory"
version = "0.1.0"
description = "Offline namespace-scoped SQLite graph memory"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "MetaRelatum (越迹科技（宁波）有限公司)" }]
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["tapestry_memory*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
