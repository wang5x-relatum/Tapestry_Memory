[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tapestry-memory"
version = "0.1.0"
description = "Offline namespace-scoped SQLite graph memory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["tapestry_memory*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
